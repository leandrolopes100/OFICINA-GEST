{% extends 'base.html' %}
{% block title %}Desativar Veículo{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-md-6">
  <div class="card"><div class="card-body text-center p-4">
    <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:3rem"></i>
    <h5 class="mt-3">Desativar veículo {{ object.placa }}?</h5>
    <form method="post">{% csrf_token %}
      <button type="submit" class="btn btn-warning me-2">Confirmar</button>
      <a href="{% url 'veiculos:detail' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div></div>
</div></div>
{% endblock %}

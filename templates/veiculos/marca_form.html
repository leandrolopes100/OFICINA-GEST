{% extends 'base.html' %}
{% block title %}Nova Marca{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0 fw-bold"><i class="bi bi-bookmark-fill text-primary"></i> Nova Marca</h4>
  <a href="{% url 'veiculos:marca_list' %}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i> Voltar
  </a>
</div>
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nome da Marca</label>
            {{ form.nome }}
            {% if form.nome.errors %}
              <div class="text-danger small">{{ form.nome.errors }}</div>
            {% endif %}
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check-circle"></i> Salvar Marca
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

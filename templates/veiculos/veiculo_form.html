{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Editar{% else %}Novo{% endif %} Veículo{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0 fw-bold"><i class="bi bi-car-front-fill text-primary"></i> {% if object %}Editar Veículo{% else %}Novo Veículo{% endif %}</h4>
  <a href="{% url 'veiculos:list' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>
<div class="card">
  <div class="card-body">{% crispy form %}</div>
</div>
{% endblock %}

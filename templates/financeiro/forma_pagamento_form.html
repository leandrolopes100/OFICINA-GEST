{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Editar{% else %}Nova{% endif %} Forma de Pagamento{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0 fw-bold">
    <i class="bi bi-credit-card-fill text-primary"></i>
    {% if object %}Editar Forma de Pagamento{% else %}Nova Forma de Pagamento{% endif %}
  </h4>
  <a href="{% url 'financeiro:formas_list' %}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i> Voltar
  </a>
</div>
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">{% crispy form %}</div>
    </div>
  </div>
</div>
{% endblock %}

{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}{{ oficina.nome }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; color: #212529; }
    .pagina { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
    .topo { background: #1a1a2e; color: #fff; }
    .topo .pagina { padding-top: 14px; padding-bottom: 14px; display: flex; align-items: center; gap: 12px; }
    .topo img { max-height: 40px; max-width: 160px; object-fit: contain; background: #fff; border-radius: 6px; padding: 4px 6px; }
    .topo .nome-oficina { font-weight: 600; font-size: 1rem; line-height: 1.2; }
    .bloco { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07); padding: 16px; margin-bottom: 12px; }
    .bloco-titulo { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #8a919b; margin-bottom: 10px; }
    .item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .item:last-child { border-bottom: none; }
    .item-desc { font-size: .92rem; }
    .item-qtd { font-size: .78rem; color: #6c757d; }
    .item-valor { font-weight: 600; white-space: nowrap; }
    .total-linha { display: flex; justify-content: space-between; font-size: .9rem; padding: 3px 0; }
    .total-final { font-size: 1.35rem; font-weight: 700; border-top: 1px solid #e9ecef; margin-top: 6px; padding-top: 8px; }
    .btn-lg { font-size: 1rem; padding: .8rem 1rem; }
    details summary { cursor: pointer; }
  </style>
</head>
<body>
<header class="topo">
  <div class="pagina">
    {% if oficina.logo %}<img src="{% static oficina.logo %}" alt="">{% endif %}
    <div class="nome-oficina">{{ oficina.nome }}</div>
  </div>
</header>
<main class="pagina">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>

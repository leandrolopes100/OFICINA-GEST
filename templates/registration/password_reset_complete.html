{% extends 'base.html' %}
{% block title %}Senha Redefinida — Oficina-Gest{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-7 col-lg-5">

    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">

        <i class="bi bi-check-circle-fill text-success" style="font-size:3rem"></i>
        <h5 class="fw-bold mt-3 mb-2">Senha redefinida com sucesso!</h5>

        <p class="text-muted small mb-4">
          Sua nova senha foi salva. Você já pode fazer login no sistema.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn btn-primary">
          <i class="bi bi-box-arrow-in-right me-1"></i> Ir para o login
        </a>

      </div>
    </div>

  </div>
</div>
{% endblock %}

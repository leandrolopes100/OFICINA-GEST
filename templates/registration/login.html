{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Oficina-Gest</title>
  <meta name="description" content="Oficina interna da R2RENT Aluguel de Veículos: orçamentos, ordens de serviço, estoque de peças e financeiro.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="R2RENT · Oficina">
  <meta property="og:title" content="Oficina R2RENT: gestão da oficina interna">
  <meta property="og:description" content="Orçamentos, ordens de serviço, estoque de peças e financeiro da oficina interna da R2RENT Aluguel de Veículos.">
  <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}/">
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'og-image.png' %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&text=OFICINAGEST&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding: 2rem 1rem;
      background: #1a1a2e;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .marca { text-align: center; }
    .marca img { display: block; height: 52px; width: auto; max-width: 220px; object-fit: contain; margin: 0 auto .7rem; }
    .marca-sistema { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 1.15rem; line-height: 1; letter-spacing: .01em; color: #eceef2; }
    .marca-destaque { color: #e5252a; }

    .ficha { width: 100%; max-width: 360px; background: #fff; border-radius: 6px; padding: 1.5rem 1.5rem 1.25rem; }
    .ficha-topo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.25rem; padding-bottom: .75rem; border-bottom: 1px solid #e9ecef; }
    .ficha-topo h1 { font-size: 1.15rem; font-weight: 700; color: #1a1a2e; margin: 0; }
    .ficha-topo time { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: .75rem; color: #8a919b; }

    .form-label { font-size: .82rem; font-weight: 600; color: #495057; margin-bottom: .3rem; }
    .form-control { border: 1px solid #ced4da; border-radius: 4px; padding: .55rem .75rem; font-size: .95rem; }
    .form-control:focus { border-color: #1a1a2e; box-shadow: 0 0 0 2px rgba(26,26,46,.18); }

    .erro-login { font-size: .84rem; color: #c81e23; margin: 0 0 .75rem; }

    .btn-entrar { width: 100%; background: #1a1a2e; border: none; color: #fff; border-radius: 4px; padding: .6rem; font-weight: 600; }
    .btn-entrar:hover, .btn-entrar:focus-visible { background: #2d2d4e; color: #fff; }
    .btn-entrar:focus-visible { outline: 2px solid #1a1a2e; outline-offset: 2px; }

    .link-senha { display: inline-block; margin-top: .9rem; font-size: .82rem; color: #6c757d; text-decoration: none; }
    .link-senha:hover { color: #1a1a2e; text-decoration: underline; }

    .rodape { font-size: .72rem; color: rgba(255,255,255,.38); }
    .rodape a { color: inherit; text-decoration: none; }
    .rodape a:hover { color: rgba(255,255,255,.7); }
  </style>
</head>
<body>

<header class="marca">
  <img src="{% static 'logo_parceiro_escuro.png' %}" alt="R2RENT">
  <span class="marca-sistema">OFICINA<span class="marca-destaque">GEST</span></span>
</header>

<main class="ficha">
  <div class="ficha-topo">
    <h1>Entrar</h1>
    <time datetime="{% now 'Y-m-d' %}">{% now 'd/m/Y' %}</time>
  </div>

  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Usuário</label>
      <input type="text" name="username" id="id_username" class="form-control"
             value="{{ form.username.value|default:'' }}"
             autofocus autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Senha</label>
      <input type="password" name="password" id="id_password" class="form-control"
             autocomplete="current-password" required>
    </div>

    {% if form.errors %}
    <p class="erro-login" role="alert">Usuário ou senha incorretos.</p>
    {% endif %}

    {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <button type="submit" class="btn btn-entrar">Entrar</button>
  </form>

  <a href="/accounts/senha/redefinir/" class="link-senha">Esqueci minha senha</a>
</main>

<footer class="rodape">
  Oficina Gest · <a href="https://lopsystem.com.br" target="_blank" rel="noopener">lopsystem.com.br</a>
</footer>

</body>
</html>

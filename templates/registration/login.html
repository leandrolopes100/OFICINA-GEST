{% extends 'base.html' %}
{% block title %}Login — Oficina Mecânica{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-wrench-adjustable-circle-fill text-warning" style="font-size:3rem"></i>
          <h4 class="mt-2 fw-bold">Oficina Mecânica</h4>
          <p class="text-muted small">Sistema de Gestão</p>
        </div>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

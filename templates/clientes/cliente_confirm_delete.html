{% extends 'base.html' %}
{% block title %}Desativar Cliente{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body text-center p-4">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:3rem"></i>
        <h5 class="mt-3">Desativar cliente?</h5>
        <p class="text-muted">O cliente <strong>{{ object.nome }}</strong> será desativado mas seus dados serão mantidos.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-warning me-2">Confirmar</button>
          <a href="{% url 'clientes:detail' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: oficina
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina_dev
      POSTGRES_USER: oficina_user
      POSTGRES_PASSWORD: oficina@2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: